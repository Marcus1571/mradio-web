name: Deploy to production

# The push-to-main trigger is disabled (2026-09-14): DEPLOY_HOST/PORT/USER/KEY
# secrets were never configured on this repo, so every push-triggered run has
# failed since at least 2026-09-12 (confirmed via `gh run list` — 26/26
# failures, all "missing server host" within ~15s, before any SSH attempt).
# Direct SSH is the actual working deploy path (see AGENTS.md/STATUS.md) and
# has been used for every real deploy. Re-enable the `push:` trigger below
# once the four secrets are set in repo Settings -> Secrets and variables ->
# Actions, and this workflow has been verified with a manual
# workflow_dispatch run first.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            for d in /mnt/user/appdata/mradio-web/app /mnt/cache/appdata/mradio-web/app; do
              if [ -d "$d/.git" ]; then
                cd "$d"
                git pull
                docker compose build
                docker compose up -d
                docker compose logs --tail 30
                exit 0
              fi
            done
            echo "mradio-web checkout not found in any of: /mnt/user/appdata/mradio-web/app /mnt/cache/appdata/mradio-web/app" >&2
            echo "--- debugging: showing what actually exists ---" >&2
            for base in /mnt/user/appdata/mradio-web /mnt/cache/appdata/mradio-web; do
              echo "ls -la $base:" >&2
              ls -la "$base" 2>&1 >&2 || echo "  (does not exist)" >&2
            done
            exit 1
