services:
  mradio-web:
    build: .
    container_name: mradio-web
    ports:
      - "8000:8000"
    volumes:
      # On LT: /mnt/cache/appdata/mradio-web instead of ./data
      - ./data:/data
    environment:
      # Bootstrap admin account — only used on first run (no users yet).
      # Change these, or just sign in with them once and set a real
      # password immediately (the app forces this on first login anyway).
      - MRADIO_ADMIN_USERNAME=admin
      - MRADIO_ADMIN_PASSWORD=mradio
      # Optional: a self-hosted SearXNG, used as a last resort to find
      # station logos that neither the radio directory nor the station's
      # own site provides. Leave unset if you don't run one — that
      # lookup tier is simply skipped. See KB.md § station logos.
      - MRADIO_SEARXNG_URL=${MRADIO_SEARXNG_URL:-}
      # Spotify OAuth redirect URI. Client credentials live in settings.json
      # and are editable in the UI.
      - MRADIO_SPOTIFY_REDIRECT_URI=${MRADIO_SPOTIFY_REDIRECT_URI:-}
      # Deezer OAuth redirect URI. Client credentials live in settings.json
      # and are editable in the UI.
      - MRADIO_DEEZER_REDIRECT_URI=${MRADIO_DEEZER_REDIRECT_URI:-}
      # Token encryption key for OAuth refresh tokens (Spotify and Deezer).
      # Falls back to MRADIO_SPOTIFY_TOKEN_KEY for existing installs.
      - MRADIO_TOKEN_KEY=${MRADIO_TOKEN_KEY:-}
      - MRADIO_SPOTIFY_TOKEN_KEY=${MRADIO_SPOTIFY_TOKEN_KEY:-}
    restart: unless-stopped
